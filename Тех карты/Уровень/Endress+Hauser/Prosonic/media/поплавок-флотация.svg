<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Возможная схема Prosonic с поплавком</title><desc id="desc">Ультразвуковой датчик над отражателем на штоке поплавка. Положение и устройство поплавка условны; необходимо проверить фактический узел.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#007F78" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="710" rx="18" fill="#F3F6FA"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="46" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#14283F" font-weight="bold" text-anchor="start">Поплавок и отражатель · возможная компоновка</text><text x="46" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#526477" font-weight="normal" text-anchor="start">Рабочая гипотеза по описанию участка; не заводской чертёж вашего узла</text><rect x="70" y="365" width="640" height="270" rx="4" fill="#FFFFFF" stroke="#14283F" stroke-width="2"/><rect x="73" y="500" width="634" height="132" rx="0" fill="#CDEAE7" stroke="#CDEAE7" stroke-width="2"/><rect x="73" y="410" width="634" height="90" rx="0" fill="#F6E9CF" stroke="#F6E9CF" stroke-width="2"/><text x="92" y="449" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#AF5700" font-weight="normal" text-anchor="start">Пенный слой</text><text x="92" y="588" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#007F78" font-weight="normal" text-anchor="start">Пульпа</text><rect x="300" y="150" width="140" height="55" rx="8" fill="#14283F" stroke="#14283F" stroke-width="2"/><text x="285" y="132" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#14283F" font-weight="bold" text-anchor="start">Prosonic / FDU</text><rect x="292" y="302" width="156" height="16" rx="2" fill="#007F78" stroke="#007F78" stroke-width="2"/><line x1="370" y1="318" x2="370" y2="506" stroke="#14283F" stroke-width="3"/><ellipse cx="370" cy="508" rx="68" ry="46" fill="#FFFFFF" stroke="#14283F" stroke-width="3"/><text x="325" y="516" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#14283F" font-weight="normal" text-anchor="start">Поплавок</text><line x1="370" y1="205" x2="370" y2="300" stroke="#007F78" stroke-width="3" stroke-dasharray="9 7"/><line x1="550" y1="205" x2="550" y2="302" stroke="#007F78" stroke-width="3" marker-end="url(#arrow)"/><text x="566" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#007F78" font-weight="bold" text-anchor="start">D до цели</text><text x="466" y="343" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#14283F" font-weight="normal" text-anchor="start">Отражатель</text><line x1="448" y1="310" x2="560" y2="310" stroke="#526477" stroke-width="3"/><text x="748" y="199" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#14283F" font-weight="bold" text-anchor="start">Проверить на месте:</text><text x="748" y="245" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#14283F" font-weight="normal" text-anchor="start">1. Что служит целью</text><text x="748" y="290" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#14283F" font-weight="normal" text-anchor="start">2. Свободный ход</text><text x="748" y="335" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#14283F" font-weight="normal" text-anchor="start">3. Связь с уровнем</text><text x="748" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#14283F" font-weight="normal" text-anchor="start">4. Эхо от нужной цели</text><text x="748" y="425" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#14283F" font-weight="normal" text-anchor="start">5. Запас до BD</text><text x="748" y="495" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#526477" font-weight="normal" text-anchor="start">Размеры, плавучесть</text><text x="748" y="527" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#526477" font-weight="normal" text-anchor="start">и направляющие —</text><text x="748" y="559" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#526477" font-weight="normal" text-anchor="start">по паспорту узла.</text><text x="45" y="681" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#526477" font-weight="normal" text-anchor="start">Инженерная иллюстрация. A1 подтверждает FDU91 для флотации, но не эту механику.</text></g></svg>
