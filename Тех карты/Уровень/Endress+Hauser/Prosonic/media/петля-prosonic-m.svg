<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Prosonic M HART: токовая петля</title><desc id="desc">Плюс источника на 2 L+, 1 L− на AI+, AI− на минус источника. Земля не является сигнальным минусом.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#007F78" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="620" rx="18" fill="#F3F6FA"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="46" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#14283F" font-weight="bold" text-anchor="start">Prosonic M HART · двухпроводная петля</text><text x="46" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#526477" font-weight="normal" text-anchor="start">Отдельное питание + пассивный токовый вход; обычная зона, без барьера</text><rect x="70" y="165" width="245" height="150" rx="14" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/><text x="96" y="204" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#14283F" font-weight="bold" text-anchor="start">Источник DC</text><text x="96" y="245" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#526477" font-weight="normal" text-anchor="start">U по расчёту петли</text><text x="265" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#14283F" font-weight="bold" text-anchor="start">+</text><text x="95" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#14283F" font-weight="bold" text-anchor="start">−</text><rect x="450" y="165" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/><text x="476" y="204" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#14283F" font-weight="bold" text-anchor="start">Prosonic M HART</text><text x="476" y="245" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#526477" font-weight="normal" text-anchor="start">Питание и сигнал вместе</text><text x="480" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#14283F" font-weight="bold" text-anchor="start">2 · L+</text><text x="650" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#14283F" font-weight="bold" text-anchor="start">1 · L−</text><rect x="875" y="165" width="255" height="150" rx="14" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/><text x="899" y="204" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#14283F" font-weight="bold" text-anchor="start">Вход ПЛК</text><text x="899" y="245" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#526477" font-weight="normal" text-anchor="start">Пассивный, 4–20 мА</text><text x="899" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#14283F" font-weight="bold" text-anchor="start">AI+</text><text x="1048" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#14283F" font-weight="bold" text-anchor="start">AI−</text><polyline points="276,315 276,358 505,358 505,315" fill="none" stroke="#007F78" stroke-width="3" stroke-linejoin="round"/><polyline points="692,315 692,358 920,358 920,315" fill="none" stroke="#007F78" stroke-width="3" stroke-linejoin="round"/><polyline points="1070,315 1070,410 108,410 108,315" fill="none" stroke="#007F78" stroke-width="3" stroke-linejoin="round"/><text x="370" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#007F78" font-weight="bold" text-anchor="start">I →</text><text x="55" y="472" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#14283F" font-weight="bold" text-anchor="start">Напряжение на приборе зависит от исполнения и тока: таблица M1, с.29.</text><text x="55" y="512" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#526477" font-weight="normal" text-anchor="start">Земля / уравнивание потенциалов — отдельное соединение по инструкции.</text><text x="55" y="551" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#AF5700" font-weight="normal" text-anchor="start">Активный вход ПЛК требует своей схемы; второй источник вслепую не добавлять.</text><text x="55" y="592" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#526477" font-weight="normal" text-anchor="start">Источник: M1, с.29. Для HART ≥250 Ом в цепи; проверить суммарную нагрузку.</text></g></svg>
