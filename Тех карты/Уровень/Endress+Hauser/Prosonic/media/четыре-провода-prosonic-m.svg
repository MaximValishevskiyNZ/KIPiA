<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Prosonic M HART: раздельное питание и выход</title><desc id="desc">Клеммы 1 и 2 питание, 5 и 6 активный выход. Пассивный вход ПЛК. Питание выбирают по исполнению.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#007F78" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="620" rx="18" fill="#F3F6FA"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="46" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#14283F" font-weight="bold" text-anchor="start">Prosonic M HART · четыре провода</text><text x="46" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#526477" font-weight="normal" text-anchor="start">Активный токовый выход подключается к пассивному входу ПЛК</text><rect x="55" y="180" width="275" height="190" rx="14" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/><text x="80" y="218" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#14283F" font-weight="bold" text-anchor="start">Питание по шильдику</text><text x="80" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#14283F" font-weight="normal" text-anchor="start">10,5–32 В DC</text><text x="80" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#14283F" font-weight="normal" text-anchor="start">ИЛИ 90–253 В AC</text><text x="80" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#AF5700" font-weight="normal" text-anchor="start">Разные исполнения</text><rect x="455" y="155" width="300" height="300" rx="14" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/><text x="479" y="196" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#14283F" font-weight="bold" text-anchor="start">Prosonic M HART</text><text x="479" y="247" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#14283F" font-weight="normal" text-anchor="start">1 · L1/L+</text><text x="479" y="294" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#14283F" font-weight="normal" text-anchor="start">2 · N/L−</text><text x="585" y="365" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#007F78" font-weight="bold" text-anchor="start">5 · I+</text><text x="585" y="412" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#007F78" font-weight="bold" text-anchor="start">6 · I−</text><rect x="880" y="290" width="270" height="165" rx="14" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/><text x="902" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#14283F" font-weight="bold" text-anchor="start">Вход ПЛК</text><text x="902" y="366" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#14283F" font-weight="normal" text-anchor="start">AI+ · пассивный</text><text x="902" y="413" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#14283F" font-weight="normal" text-anchor="start">AI−</text><polyline points="330,239 420,239 420,239 455,239" fill="none" stroke="#007F78" stroke-width="3" stroke-linejoin="round"/><polyline points="330,286 455,286" fill="none" stroke="#007F78" stroke-width="3" stroke-linejoin="round"/><line x1="755" y1="357" x2="880" y2="357" stroke="#007F78" stroke-width="3" marker-end="url(#arrow)"/><line x1="880" y1="404" x2="755" y2="404" stroke="#007F78" stroke-width="3"/><text x="55" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#14283F" font-weight="bold" text-anchor="start">Нагрузка активного выхода: максимум 600 Ом. Питание на выход не подавать.</text><text x="55" y="563" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#526477" font-weight="normal" text-anchor="start">Земля и защита цепи питания — по инструкции конкретного исполнения.</text><text x="55" y="601" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#526477" font-weight="normal" text-anchor="start">Источник: M1, с.29–30. Схема только для 4-wire HART, не PA/FF.</text></g></svg>
