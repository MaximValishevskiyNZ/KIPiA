<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Геометрия E, F, D, L и BD</title><desc id="desc">E от мембраны до нуля. D до продукта. F высота рабочего диапазона. L фактический уровень. Верхняя точка не входит в BD.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#007F78" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="710" rx="18" fill="#F3F6FA"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="46" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#14283F" font-weight="bold" text-anchor="start">Геометрия измерения уровня</text><text x="46" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#526477" font-weight="normal" text-anchor="start">Непосредственное измерение поверхности; схема без масштаба</text><rect x="100" y="180" width="520" height="425" rx="4" fill="#FFFFFF" stroke="#14283F" stroke-width="2"/><rect x="295" y="125" width="125" height="55" rx="8" fill="#14283F" stroke="#14283F" stroke-width="2"/><rect x="103" y="183" width="514" height="65" rx="0" fill="#FAE8D5" stroke="#FAE8D5" stroke-width="2"/><text x="125" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#AF5700" font-weight="normal" text-anchor="start">BD · ближняя зона</text><rect x="103" y="410" width="514" height="192" rx="0" fill="#CDEAE7" stroke="#CDEAE7" stroke-width="2"/><line x1="100" y1="300" x2="620" y2="300" stroke="#526477" stroke-width="3" stroke-dasharray="9 7"/><text x="125" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#14283F" font-weight="normal" text-anchor="start">100% рабочего диапазона</text><line x1="100" y1="410" x2="620" y2="410" stroke="#007F78" stroke-width="3"/><text x="125" y="449" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#007F78" font-weight="normal" text-anchor="start">Поверхность продукта</text><line x1="100" y1="580" x2="620" y2="580" stroke="#14283F" stroke-width="3" stroke-dasharray="9 7"/><text x="125" y="568" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#14283F" font-weight="normal" text-anchor="start">0% · выбранный ноль</text><line x1="357" y1="180" x2="357" y2="410" stroke="#007F78" stroke-width="3" stroke-dasharray="9 7"/><line x1="715" y1="180" x2="715" y2="580" stroke="#007F78" stroke-width="3" marker-end="url(#arrow)"/><line x1="702" y1="180" x2="728" y2="180" stroke="#14283F" stroke-width="3"/><text x="730" y="380.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#14283F" font-weight="bold" text-anchor="start">E</text><line x1="815" y1="180" x2="815" y2="410" stroke="#007F78" stroke-width="3" marker-end="url(#arrow)"/><line x1="802" y1="180" x2="828" y2="180" stroke="#14283F" stroke-width="3"/><text x="830" y="295.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#14283F" font-weight="bold" text-anchor="start">D</text><line x1="915" y1="300" x2="915" y2="580" stroke="#007F78" stroke-width="3" marker-end="url(#arrow)"/><line x1="902" y1="300" x2="928" y2="300" stroke="#14283F" stroke-width="3"/><text x="930" y="440.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#14283F" font-weight="bold" text-anchor="start">F</text><line x1="1015" y1="410" x2="1015" y2="580" stroke="#007F78" stroke-width="3" marker-end="url(#arrow)"/><line x1="1002" y1="410" x2="1028" y2="410" stroke="#14283F" stroke-width="3"/><text x="1030" y="495.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#14283F" font-weight="bold" text-anchor="start">L</text><text x="690" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#526477" font-weight="normal" text-anchor="start">Отсчёт от мембраны</text><text x="680" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#007F78" font-weight="bold" text-anchor="start">L = E − D</text><text x="45" y="683" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#526477" font-weight="normal" text-anchor="start">T1, с.31; M1, с.41,45; S1, с.51. Для отражателя поплавка нужна привязка к уровню.</text></g></svg>
