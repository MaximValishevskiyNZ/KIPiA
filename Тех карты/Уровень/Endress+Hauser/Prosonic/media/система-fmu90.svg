<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">FDU и отдельный FMU90</title><desc id="desc">Три проводника FDU на 9 YE, 10 BK, 11 RD. Питание FMU90 отдельно. Аналоговый выход 4/5 идёт в систему управления.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#007F78" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="620" rx="18" fill="#F3F6FA"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="46" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#14283F" font-weight="bold" text-anchor="start">Prosonic S · FDU + FMU90</text><text x="46" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#526477" font-weight="normal" text-anchor="start">Датчик FDU не подключается напрямую к обычному входу 4–20 мА</text><rect x="55" y="205" width="250" height="190" rx="14" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/><text x="80" y="246" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" fill="#14283F" font-weight="bold" text-anchor="start">Датчик FDU</text><text x="80" y="293" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#14283F" font-weight="normal" text-anchor="start">YE · жёлтый</text><text x="80" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#14283F" font-weight="normal" text-anchor="start">BK · чёрный / экран</text><text x="80" y="373" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#14283F" font-weight="normal" text-anchor="start">RD · красный</text><rect x="430" y="155" width="320" height="325" rx="14" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/><text x="456" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" fill="#14283F" font-weight="bold" text-anchor="start">FMU90 HART</text><text x="456" y="242" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#526477" font-weight="normal" text-anchor="start">Вход датчика 1:</text><text x="456" y="293" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#14283F" font-weight="normal" text-anchor="start">9 · YE</text><text x="456" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#14283F" font-weight="normal" text-anchor="start">10 · BK</text><text x="456" y="373" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#14283F" font-weight="normal" text-anchor="start">11 · RD</text><text x="456" y="433" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#007F78" font-weight="bold" text-anchor="start">Выход 1: клеммы 4 / 5</text><line x1="305" y1="286" x2="430" y2="286" stroke="#007F78" stroke-width="3"/><line x1="305" y1="326" x2="430" y2="326" stroke="#007F78" stroke-width="3"/><line x1="305" y1="366" x2="430" y2="366" stroke="#007F78" stroke-width="3"/><rect x="880" y="330" width="260" height="135" rx="14" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/><text x="906" y="371" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#14283F" font-weight="bold" text-anchor="start">Система управления</text><text x="906" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#14283F" font-weight="normal" text-anchor="start">Вход 0/4–20 мА</text><line x1="750" y1="425" x2="880" y2="425" stroke="#007F78" stroke-width="3" marker-end="url(#arrow)"/><text x="800" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#526477" font-weight="normal" text-anchor="start">Сигнал выхода</text><text x="55" y="526" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#14283F" font-weight="bold" text-anchor="start">Питание FMU90 отдельно: 1 / 2 / 3 по AC- или DC-исполнению.</text><text x="55" y="563" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#AF5700" font-weight="normal" text-anchor="start">GNYE, если есть, не объединять с BK. Наличие второго входа — по комплектации.</text><text x="55" y="601" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#526477" font-weight="normal" text-anchor="start">Источник: S1, с.24–29. Полярность выхода и земля — по маркировке и полной схеме.</text></g></svg>
