<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Шаблон инженерной схемы</title><desc id="desc">Заменить устройства, номера клемм, направление сигнала, применимость и источник.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#007F78" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="620" rx="18" fill="#F3F6FA"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="46" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#14283F" font-weight="bold" text-anchor="start">{Устройство} · {название схемы}</text><text x="46" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#526477" font-weight="normal" text-anchor="start">Исполнение: {модель / интерфейс / питание}; статус: {подтверждено / условно}</text><rect x="65" y="220" width="270" height="170" rx="14" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/><text x="87" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#14283F" font-weight="bold" text-anchor="start">Вход / источник</text><text x="87" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#14283F" font-weight="normal" text-anchor="start">{клеммы и назначение}</text><rect x="465" y="220" width="270" height="170" rx="14" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/><text x="487" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#14283F" font-weight="bold" text-anchor="start">Устройство</text><text x="487" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#14283F" font-weight="normal" text-anchor="start">{клеммы и назначение}</text><rect x="865" y="220" width="270" height="170" rx="14" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/><text x="887" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#14283F" font-weight="bold" text-anchor="start">Выход / система</text><text x="887" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#14283F" font-weight="normal" text-anchor="start">{клеммы и назначение}</text><line x1="335" y1="305" x2="465" y2="305" stroke="#007F78" stroke-width="3" marker-end="url(#arrow)"/><line x1="735" y1="305" x2="865" y2="305" stroke="#007F78" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="490" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#AF5700" font-weight="normal" text-anchor="start">Ограничения: {указать границы применимости и условные элементы}</text><text x="55" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#526477" font-weight="normal" text-anchor="start">Источник: {документ, редакция, напечатанная страница / раздел}</text></g></svg>
